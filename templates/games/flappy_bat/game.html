<div class="flappy-bat-game" data-game="flappy-bat">
  <div class="old-game-panel">
    <div class="game-status">
      <div><strong>Score</strong> <span data-flappy-score>0</span></div>
      <div><strong>Goal</strong> <span>10</span></div>
